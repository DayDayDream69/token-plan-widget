name: Build

on:
  push:
    branches: [main]      # 每次推送都构建（产物在 Artifacts）
    tags: ['v*']          # 推 tag 时构建 Release
  workflow_dispatch: {}   # 手动触发

permissions:
  contents: write         # 允许上传 Release 附件

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --publish always
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dir --publish always

      - name: Package macOS app as zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          for d in mac*/; do
            arch="${d%/}"
            arch="${arch#mac}"
            case "$arch" in
              arm64) tag="arm64" ;;
              *) tag="x64" ;;
            esac
            (cd "$d" && zip -qry "../TokenPlan-${GITHUB_REF_NAME#v}-mac-$tag.zip" "Token Plan.app")
          done
          ls -lh *.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      # 仅在推 tag（v*）时：把产物挂到 GitHub Release，同事可直接下载
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
